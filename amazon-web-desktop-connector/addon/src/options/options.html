<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsPageTitle"></title>
  <link rel="stylesheet" href="options.css" />
  <script src="options.js" type="module"></script>
</head>

<body>
  <div class="page">
    <div class="page-header">
      <img src="../icon64.png" alt="" />
      <div>
        <h1 data-i18n="extensionName"></h1>
        <p data-i18n="optionsSubtitle"></p>
      </div>
    </div>

    <div id="banner" class="banner banner-checking">
      <div class="spinner" id="banner-spinner"></div>
      <div class="banner-text">
        <strong id="banner-title" data-i18n="bannerChecking"></strong>
        <span id="banner-detail"></span>
      </div>
      <button id="retry-btn" type="button" class="secondary" data-i18n="btnRetry" hidden></button>
    </div>

    <!-- Setup: shown while the helper app cannot be reached -->
    <div id="setup-section" class="section" hidden>
      <h2 data-i18n="setupHeading"></h2>
      <p data-i18n="setupIntro"></p>
      <ol>
        <li data-i18n="setupArchitectureLi1"></li>
        <li data-i18n="setupArchitectureLi2"></li>
        <li data-i18n="setupArchitectureLi3"></li>
      </ol>
      <div class="warning" data-i18n="setupSecurityNotice"></div>

      <div class="download-box">
        <div class="dl-text">
          <strong data-i18n="setupDownloadTitle"></strong>
          <span>amazon-music-connector-host.zip</span>
        </div>
        <button id="download-btn" type="button" data-i18n="btnDownload"></button>
      </div>

      <p data-i18n="setupInstructions"></p>
      <ul data-os="win">
        <li><span data-i18n="setupInstallWin"></span> <code>install.bat</code></li>
      </ul>
      <ul data-os="unix">
        <li><span data-i18n="setupInstallUnix"></span> <code>bash install.sh</code></li>
      </ul>
      <div data-os="unix">
        <p data-i18n="setupPythonUnix"></p>
        <ul>
          <li>Debian / Ubuntu: <code>sudo apt install python3</code></li>
          <li>Fedora: <code>sudo dnf install python3</code></li>
          <li>macOS (Homebrew): <code>brew install python3</code></li>
        </ul>
      </div>
      <p data-i18n="setupRestart"></p>
      <div class="notice" data-os="linux" data-i18n="setupSnapNotice"></div>
    </div>

    <!-- Everything below is shown while the helper app is connected -->
    <div id="info-section" hidden>

      <div id="pairing-section" class="section pairing" hidden>
        <h2 data-i18n="pairHeading"></h2>
        <p data-i18n="pairIntro"></p>
        <div id="pairing-list"></div>
      </div>

      <div class="section">
        <h2 data-i18n="amazonHeading"></h2>
        <p data-i18n="amazonIntro"></p>
        <div class="row">
          <label for="amazon-domain" data-i18n="amazonDomain"></label>
          <select id="amazon-domain"></select>
          <button id="amazon-open" type="button" data-i18n="btnOpenAmazon"></button>
        </div>
        <div id="amazon-tabs" class="tab-list"></div>
      </div>

      <div class="section">
        <h2 data-i18n="qrHeading"></h2>
        <div id="qr-ready" class="qr-row" hidden>
          <div id="qr" class="qr"></div>
          <div class="qr-text">
            <p data-i18n="qrIntro"></p>
            <ol>
              <li data-i18n="qrStep1"></li>
              <li data-i18n="qrStep2"></li>
              <li data-i18n="qrStep3"></li>
              <li data-i18n="qrStep4"></li>
            </ol>
            <p class="small">
              <span data-i18n="qrLinkLabel"></span> <code id="qr-link"></code><br />
              <span id="qr-apk-info"></span>
            </p>
            <div id="qr-address-row" class="row" hidden>
              <label for="qr-address" data-i18n="qrAddressLabel"></label>
              <select id="qr-address"></select>
            </div>
          </div>
        </div>
        <div class="notice" data-i18n="qrNetworkHint"></div>
        <div id="qr-missing" class="notice" hidden data-i18n="qrNoApk"></div>
        <div id="qr-transfer" class="notice" hidden></div>

        <label class="switch">
          <input id="open-access" type="checkbox" />
          <span>
            <strong data-i18n="openAccessLabel"></strong><br />
            <span class="small" data-i18n="openAccessHelp"></span>
          </span>
        </label>

        <h3 data-i18n="androidHeading"></h3>
        <p data-i18n="androidIntro"></p>
        <table class="kv">
          <tbody>
            <tr>
              <th data-i18n="labelAddress"></th>
              <td id="addresses"></td>
            </tr>
            <tr>
              <th data-i18n="labelToken"></th>
              <td>
                <code id="token" class="token"></code>
                <button id="token-toggle" type="button" class="secondary small" data-i18n="btnShow"></button>
                <button id="token-copy" type="button" class="secondary small" data-i18n="btnCopy"></button>
                <button id="token-regenerate" type="button" class="secondary small danger"
                  data-i18n="btnRegenerate"></button>
              </td>
            </tr>
            <tr>
              <th data-i18n="labelPort"></th>
              <td>
                <input id="port-input" type="number" min="1024" max="65535" />
                <button id="port-save" type="button" class="secondary small" data-i18n="btnSave"></button>
              </td>
            </tr>
          </tbody>
        </table>
        <div id="config-error" class="error-text" hidden></div>
      </div>

      <div class="section">
        <h2 data-i18n="helperHeading"></h2>
        <table class="kv">
          <tbody id="helper-info"></tbody>
        </table>
      </div>

      <div class="section">
        <div class="section-head">
          <h2 data-i18n="requestsHeading"></h2>
          <button id="test-btn" type="button" class="secondary small" data-i18n="btnTest"></button>
        </div>
        <div id="test-result" class="test-result" hidden></div>
        <table id="requests-table">
          <thead>
            <tr>
              <th data-i18n="thTime"></th>
              <th data-i18n="thSource"></th>
              <th data-i18n="thSong"></th>
              <th data-i18n="thResult"></th>
            </tr>
          </thead>
          <tbody id="requests-body"></tbody>
        </table>
        <div id="requests-empty" class="empty-state" data-i18n="requestsEmpty"></div>
      </div>
    </div>
  </div>
</body>

</html>
